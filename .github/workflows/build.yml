name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: gw2-NoDash-dll
          path: |
            build/bin/Release/gw2-NoDash.dll
            build/bin/Release/gw2-NoDash.pdb
          if-no-files-found: error
